<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DigitalDiary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Custom Navbar */
         /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #ccccc9;
            color: #0d0d0d;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            font-family:Papyrus;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .navbar .logo img {
            height: 40px;
            margin-right: 10px;
            font-family: Papyrus;
      
        }

        .navbar .nav-links {
            display: flex;
            gap: 15px;
        }

        .navbar .nav-links a {
            color: #4747d1;
            text-decoration: none;
            font-family:Papyrus;
            font-size: 1rem;
            font-weight: 500;
            font-weight: bolder;
        }

        .navbar .nav-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }
        }
        
        /* Login Form Container */
        .container {
            max-width: 500px;
            margin-top: 50px;
            background-color: #ffeecc;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 5px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
        }

        .alert {
            margin-top: 20px;
        }

        .mt-3 {
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
   <div class="navbar">
            <div class="logo">
                <img src="/user/logo" alt="Smart Dairy Logo">
                Digital Diary
            </div>

            <div class="nav-links">
                <a href="/user/">Home</a>
                <a href="/user/login">Login</a>
                <a href="/user/register">Register</a>
            </div>
        </div>
<div class="body">
    <!-- Login Form -->
    <div class="container">
        <h2>Login</h2>
        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="mt-3">Don't have an account? <a href="/user/register">Register here</a>.</p>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    fetch('/user/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            // Store the token in sessionStorage
            // Use the token to fetch user data from /info/getUsers
            fetch(`/info/getUser?username=${data.username}`,{
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${data.token}`
                }
            })
            .then(response => response.json())
            .then(userData => {
                // If user is successfully fetched, redirect to the dashboard
                if (userData) {
                	sessionStorage.setItem('jwtToken', data.token);
                    sessionStorage.setItem('username', data.username);
                    window.location.href = '/user/dashboard'; // Render dashboard.html from templates
                } else {
                    console.error('Failed to fetch user data.');
                }
            })
            .catch(error => console.error('Error fetching user data:', error));

        } else {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.style.display = 'block';
            errorMessage.textContent = data.message;
        }
    })
    .catch(error => console.error('Error:', error));
});
</script>

    <!-- Footer (Optional) -->
    <div class="footer">
        &copy; 2025 DigitalDiary. All rights reserved.
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
