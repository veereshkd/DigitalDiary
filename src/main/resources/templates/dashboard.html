<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DigitalDiary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content {
            flex: 1;
            background: url('./images/body.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #ccccc2;
            color: #0d0d0d;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            font-family: Papyrus;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .navbar .logo img {
            height: 40px;
            margin-right: 10px;
        }

        .navbar .nav-links {
            display: flex;
            gap: 15px;
        }

        .navbar .nav-links a {
            color: #4747d1;
            text-decoration: none;
            font-family: Papyrus;
            font-size: 1rem;
            font-weight: bolder;
        }

        .navbar .nav-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* Main Content */
        .container {
            margin: 20px;
            text-align: left;
            position: relative;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .container h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #333;
        }

        .container p {
            font-size: 1rem;
            color: #555;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px;
            background-color: #333333;
            font-size: 0.9rem;
            color: #666;
        }

        .footer a {
            color: #e6e6e6;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer .social-icons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .footer .social-icons img {
            width: 24px;
            height: 24px;
        }

        /* Responsive Styling */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar .nav-links {
                margin-top: 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .container {
                padding: 15px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Navbar -->
        <div class="navbar">
            <div class="logo">
                <img src="/user/logo" alt="DigitalDiary Logo">
                Digital Diary
            </div>

            <div class="nav-links">
                <a href="/user/" class="btn btn-danger">Logout</a>
                <a href="/user/account">Account</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="container">
                <h1>Welcome to Your Dashboard</h1>
                <p id="welcomeMessage">Loading...</p>
                <p>This is your personal space where you can manage your diary notes.</p>

                <!-- Form for Diary Entry -->
                <form id="diaryForm">
                    <!-- Date Selection for Note -->
                    <div class="mb-3">
                        <label for="noteDate" class="form-label">Select Date:</label>
                        <input type="date" class="form-control" id="noteDate" required>
                    </div>

                    <!-- Note Text Area -->
                    <div class="mb-3">
                        <label for="dailyNote" class="form-label">Write Your Notes:</label>
                        <textarea class="form-control" id="dailyNote" rows="5" placeholder="Write something..."></textarea>
                    </div>

                    <!-- File Upload -->
                    <div class="mb-3">
                        <label for="fileUpload" class="form-label">Attach File (Image or Document):</label>
                        <input class="form-control" type="file" id="fileUpload" accept="image/*,.pdf,.doc,.docx">
                    </div>

                    <!-- Save Button -->
                    <button type="button" class="btn btn-primary" id="saveButton">Save</button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2025 DigitalDiary. All rights reserved. | <a href="/privacy-policy">Privacy Policy</a> | <a href="/terms">Terms of Service</a>
            <div class="social-icons">
                <a href="https://github.com" target="_blank" aria-label="GitHub">
                    <img src="/images/github.svg" alt="GitHub">
                </a>
                <a href="https://twitter.com" target="_blank" aria-label="Twitter">
                    <img src="/images/twitter.svg" alt="Twitter">
                </a>
                <a href="mailto:support@smartdairy.com" aria-label="Email">
                    <img src="/images/email.svg" alt="Email">
                </a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            const token = sessionStorage.getItem("jwtToken");
            const username = sessionStorage.getItem("username");

            if (!token) {
                alert("Unauthorized access! Redirecting to login.");
                window.location.href = "/user/login";
            } else {
                // Display the username in the welcome message
                $("#welcomeMessage").text(`Hello, ${username}`);
            }

            $('#saveButton').click(function () {
                const noteDate = $('#noteDate').val();
                const dailyNote = $('#dailyNote').val();
                const fileInput = $('#fileUpload')[0].files[0];

                if (!noteDate || !dailyNote) {
                    alert("Please select a date and write a note.");
                    return;
                }

                const formData = {
                    username: username,
                    date: noteDate,
                    note: dailyNote,
                    image: null,
                    file: null,
                };

                if (fileInput) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const base64File = e.target.result;

                        if (fileInput.type.startsWith("image/")) {
                            formData.image = base64File;
                        } else {
                            formData.file = base64File;
                        }

                        sendNoteData(formData, token);
                    };
                    reader.readAsDataURL(fileInput);
                } else {
                    sendNoteData(formData, token);
                }
            });

            function sendNoteData(data, token) {
                $.ajax({
                    url: '/api/saveDiaryEntry',
                    type: 'POST',
                    headers: { Authorization: `Bearer ${token}` },
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function () {
                        alert('Your entry has been saved successfully!');
                        $('#noteDate').val('');
                        $('#dailyNote').val('');
                        $('#fileUpload').val('');
                    },
                    error: function () {
                        alert('Failed to save your entry. Please try again.');
                    }
                });
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
