<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Dairy - Your personal dairy note management system.">
    <meta name="keywords" content="Smart Dairy, Dairy Management, Personal Notes">
    <meta name="author" content="Smart Dairy Team">
    <title>DigitalDiary - Home</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

          .content {
            flex: 1;
            background: url('/images/body.jpg') no-repeat center center; /* Background image */
            background-size: cover; /* Ensure the image covers the whole area */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-shadow: 1px 1px 2px #000; /* Add some text shadow for better readability */
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #ccccc2;
            color: #0d0d0d;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            font-family:Papyrus;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .navbar .logo img {
            height: 40px;
            margin-right: 10px;
            font-family: Papyrus;
      
        }

        .navbar .nav-links {
            display: flex;
            gap: 15px;
        }

        .navbar .nav-links a {
            color:#4747d1;
            text-decoration: none;
            font-family:Papyrus;
            font-size: 1rem;
            font-weight: 500;
            font-weight: bolder;
        }

        .navbar .nav-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* Main Content */
        .container {
            margin: 50px auto;
            text-align: center;
        }

        .container h1 {
        	font-family:Papyrus;
            font-size: 1.7rem;
            font-weight: 500;
            color: #ff9966;
        }

        .container p {
            font-size: 1.0rem;
            color: #d9d9d9;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px;
            background-color: #333333;
            font-size: 0.9rem;
            color: #666;
        }

        .footer a {
            color: #e6e6e6;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .footer .social-icons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .footer .social-icons img {
            width: 24px;
            height: 24px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="navbar">
            <div class="logo">
                <img src="/user/logo" alt="Digital Diary Logo">
                Digital Dairy
            </div>

            <div class="nav-links">
                <a href="/user/">Home</a>
                <a href="/user/login">Login</a>
                <a href="/user/register">Register</a>
            </div>
        </div>

        <div class="content" >
            <div class="container">
                <h1 th:text="${message}">Welcome to Digital Diary</h1>
                <p>Your personal dairy note management system. Easily organize and manage your notes securely.</p>
            </div>
        </div>

        <div class="footer">
            &copy; 2025 DigitalDiary. All rights reserved. | <a href="/user/privacy-policy">Privacy Policy</a> | <a href="/user/terms">Terms of Service</a>
            <div class="social-icons">
                <a href="https://github.com" target="_blank" aria-label="GitHub">
                    <img src="/images/github.svg" alt="GitHub">
                </a>
                <a href="https://twitter.com" target="_blank" aria-label="Twitter">
                    <img src="/images/twitter.svg" alt="Twitter">
                </a>
                <a href="mailto:support@smartdairy.com" aria-label="Email">
                    <img src="/images/email.svg" alt="Email">
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
