<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DigitalDiary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #007bff, #6a11cb);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #007bff;
        }

        .navbar .logo img {
            height: 40px;
        }

        .navbar .nav-links a {
            color: #007bff;
            margin-left: 15px;
            font-weight: 500;
        }

        .content {
            flex: 1;
            margin: 2rem auto;
            padding: 2rem;
            max-width: 1000px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #6a11cb;
            font-size: 2rem;
        }

        .form-section {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .form-left, .form-right {
            flex: 1;
            min-width: 280px;
        }

        .preview {
            margin-top: 1rem;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #fff;
            padding: 1rem;
        }

        #imagePreview img {
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #audioPreview audio {
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <img src="/user/logo" alt="DigitalDiary Logo">
            Digital Diary
        </div>
        <div class="nav-links">
            <a href="/user/account" class="btn btn-link">Account</a>
            <a href="/user/" class="btn btn-danger">Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="content">
        <h1>Digital Diary</h1>
        <p id="welcomeMessage" class="text-center">Loading...</p>

        <!-- Form for Diary Entry -->
        <form id="diaryForm">
            <div class="form-section">
                <!-- Left Section -->
                <div class="form-left">
                    <div class="mb-3">
                        <label for="noteDate" class="form-label">Select Date:</label>
                        <input type="date" class="form-control" id="noteDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="dailyNote" class="form-label">Write Your Notes:</label>
                        <textarea class="form-control" id="dailyNote" rows="8" placeholder="Write something..."></textarea>
                    </div>
                </div>

                <!-- Right Section -->
                <div class="form-right">
                    <div id="imagePreview" class="preview"></div>
                    <div id="audioPreview" class="preview"></div>
                    <div class="mb-3">
                        <label for="fileUpload" class="form-label">Attach File (Image or Audio):</label>
                        <input class="form-control" type="file" id="fileUpload" accept="image/*,audio/*">
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-primary w-100 mt-3" id="saveButton">Save</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
        &copy; 2025 DigitalDiary. All rights reserved.
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            const token = sessionStorage.getItem("jwtToken");
            const username = sessionStorage.getItem("username");

            if (!token) {
                alert("Unauthorized access! Redirecting to login.");
                window.location.href = "/user/login";
            } else {
                $("#welcomeMessage").text(`Welcome, ${username}!`);
            }

            // Fetch Diary Note
            $('#noteDate').change(function () {
                const selectedDate = $(this).val();
                if (!selectedDate) return;

                $.ajax({
                    url: `/api/getDiaryNote?username=${encodeURIComponent(username)}&date=${encodeURIComponent(selectedDate)}`,
                    type: 'GET',
                    headers: { Authorization: `Bearer ${token}` },
                    success: function (response) {
                        $('#dailyNote').val(response?.note || '');
                        $('#imagePreview').html(response.image ? `<img src="${response.image}" alt="Image Preview">` : '');
                        $('#audioPreview').html(response.audio ? `<audio controls><source src="${response.audio}" type="audio/mpeg"></audio>` : '');
                    },
                    error: function () {
                        alert('Error fetching the note.');
                    }
                });
            });

            // Preview file
            $('#fileUpload').change(function () {
                const file = this.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (e) {
                    if (file.type.startsWith("image/")) {
                        $('#imagePreview').html(`<img src="${e.target.result}" alt="Image Preview">`);
                        $('#audioPreview').empty();
                    } else if (file.type.startsWith("audio/")) {
                        $('#audioPreview').html(`<audio controls><source src="${e.target.result}" type="${file.type}"></audio>`);
                        $('#imagePreview').empty();
                    }
                };
                reader.readAsDataURL(file);
            });

            // Save Diary Note
            $('#saveButton').click(function () {
                const noteDate = $('#noteDate').val();
                const dailyNote = $('#dailyNote').val();
                const fileInput = $('#fileUpload')[0].files[0];

                if (!noteDate || !dailyNote) {
                    alert("Please select a date and write a note.");
                    return;
                }

                const formData = { username, date: noteDate, note: dailyNote, image: null, audio: null };

                if (fileInput) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const base64File = e.target.result;
                        if (fileInput.type.startsWith("image/")) {
                            formData.image = base64File;
                        } else if (fileInput.type.startsWith("audio/")) {
                            formData.audio = base64File;
                        }
                        saveNoteToServer(formData);
                    };
                    reader.readAsDataURL(fileInput);
                } else {
                    saveNoteToServer(formData);
                }
            });

            function saveNoteToServer(data) {
                $.ajax({
                    url: '/api/saveDiaryEntry',
                    type: 'POST',
                    headers: { Authorization: `Bearer ${token}` },
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function () {
                        alert('Your entry has been saved successfully!');
                        $('#diaryForm')[0].reset();
                        $('#imagePreview').html('');
                        $('#audioPreview').html('');
                    },
                    error: function () {
                        alert('Failed to save your entry.');
                    }
                });
            }
        });
    </script>
</body>
</html>
