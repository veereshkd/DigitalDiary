<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Digital Diary</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<!-- Include the intl-tel-input CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css">

<style>
 /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #ccccc9;
            color: #0d0d0d;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            font-family:Papyrus;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .navbar .logo img {
            height: 40px;
            margin-right: 10px;
            font-family: Papyrus;
      
        }

        .navbar .nav-links {
            display: flex;
            gap: 15px;
        }

        .navbar .nav-links a {
            color: #4747d1;
            text-decoration: none;
            font-family:Papyrus;
            font-size: 1rem;
            font-weight: 500;
            font-weight: bolder;
        }

        .navbar .nav-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
            }
        }
/* Center the form and make it a bit more compact */
.container {
	max-width: 500px;
	margin-top: 50px;
	background-color: #ffeecc;
	padding: 30px;
	border-radius: 8px;
	box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

h2 {
	text-align: center;
	margin-bottom: 20px;
}

.form-label {
	font-weight: 600;
}

.form-control {
	border-radius: 5px;
}

.btn-primary {
	width: 100%;
	padding: 10px;
}

.alert {
	margin-top: 20px;
}

.mt-3 {
	margin-top: 20px;
}

/* Footer */
.footer {
	text-align: center;
	padding: 5px;
	background-color: #333333;
	font-size: 0.9rem;
	color: #666;
}

.footer a {
	color: #e6e6e6;
	text-decoration: none;
}

.footer a:hover {
	text-decoration: underline;
}

.footer .social-icons {
	display: flex;
	justify-content: center;
	gap: 10px;
	margin-top: 10px;
}

.footer .social-icons img {
	width: 24px;
	height: 24px;
}

/* Styling for the phone number input */
#phone_number {
	width: 100%;
}
</style>
</head>
<body>
	<!-- Navbar -->
	<div class="navbar">
		<div class="logo">
			<img src="/user/logo" alt="Digital Diary Logo"> Digital Diary
		</div>

		<div class="nav-links">
			<a href="/user/">Home</a> <a href="/user/login">Login</a> <a
				href="/user/register">Register</a>
		</div>
	</div>

	<!-- Main Content -->
	<div class="container">
		<form id="registerForm">
			<h2 class="mb-4">Register</h2>

			<!-- Success or Error Messages (Initially Hidden) -->
			<div id="message" class="mb-3" style="display: none;">
				<div id="successMessage" class="alert alert-success" role="alert"></div>
				<div id="errorMessage" class="alert alert-danger" role="alert"></div>
			</div>

			<!-- Registration Form -->
			<div class="mb-3">
				<label for="firstname" class="form-label">FirstName</label> <input
					type="text" name="firstname" id="firstname" class="form-control"
					required>
			</div>
			<div class="mb-3">
				<label for="lastname" class="form-label">LastName</label> <input
					type="text" name="lastname" id="lastname" class="form-control"
					required>
			</div>
			<div class="mb-3">
				<label for="username" class="form-label">Username</label> <input
					type="text" name="username" id="username" class="form-control"
					required>
			</div>
			<div class="mb-3">
				<label for="email" class="form-label">Email</label> <input
					type="email" name="email" id="email" class="form-control" required>
				<button type="button" class="btn btn-primary mt-2"
					id="sendOtpButton">Send OTP</button>
				<div id="otpMessage" class="mt-2" style="display: none;"></div>
			</div>
			<div class="mb-3" id="otpField" style="display: none;">
				<label for="otp" class="form-label">Enter OTP</label> <input
					type="text" name="otp" id="otp" class="form-control" required>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">Password</label> <input
					type="password" name="password" id="password" class="form-control"
					required>
			</div>
			<div class="mb-3">
				<label for="phone_number" class="form-label">Phone Number</label> <input
					type="tel" name="phone_number" id="phone_number"
					class="form-control" required>
			</div>
			<div class="mb-3">
				<label for="dob" class="form-label">Date of Birth</label> <input
					type="date" name="dob" id="dob" class="form-control" required>
			</div>
			<button type="submit" class="btn btn-success w-100">Register</button>

			<p class="mt-3">
				Already registered? <a href="/user/login">Login here</a>.
			</p>
		</form>
	</div>

	<!-- Include the intl-tel-input JS -->
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>

	<script>
        // Initialize the intl-tel-input plugin
        const input = document.querySelector("#phone_number");
        const iti = window.intlTelInput(input, {
            initialCountry: "in", // Default country code (India, in this case)
            separateDialCode: true, // Show country code in input
            preferredCountries: ['us', 'ca', 'gb'], // List of preferred countries
            nationalMode: false,  // Forces international mode (prevents adding local number with 0)
        });

        // Handle OTP request
        document.getElementById('sendOtpButton').addEventListener('click', function () {
            const email = document.getElementById('email').value;

            if (!email) {
                alert("Please enter a valid email address.");
                return;
            }

            const emailRequest = { to: email };

            fetch('/user/send-otp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(emailRequest)
            })
            .then(response => response.text())
            .then(message => {
                const otpMessage = document.getElementById('otpMessage');
                otpMessage.style.display = 'block';
                otpMessage.textContent = message;
                otpMessage.className = 'alert alert-success';

                // Unhide the OTP input field
                document.getElementById('otpField').style.display = 'block';
            })
            .catch(error => {
                const otpMessage = document.getElementById('otpMessage');
                otpMessage.style.display = 'block';
                otpMessage.textContent = 'Failed to send OTP. Please try again.';
                otpMessage.className = 'alert alert-danger';
            });
        });

        // Handle form submission
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const firstname = document.getElementById('firstname').value;
            const lastname = document.getElementById('lastname').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const otp = document.getElementById('otp').value;
            const password = document.getElementById('password').value;
            const phone_number = document.getElementById('phone_number').value;
            const dob = document.getElementById('dob').value;

            const user = {
                firstname,
                lastname,
                username,
                email,
                otp,
                password,
                phone_number: parseInt(phone_number.replace(/\D/g, '')), // Convert to numeric long format
                dob
            };

            fetch('/user/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(user)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'successful') {
                    alert('Registration successful! Redirecting to login...');
                    window.location.href = '/user/login';
                } else {
                    alert('Registration failed: ' + data.message);
                }
            })
            .catch(error => {
                alert('An error occurred during registration.');
            });
        });
    </script>

	<!-- Footer (Optional) -->
	<div class="footer">
		&copy; 2025 Digital Diary. All rights reserved.
		<div class="social-icons">
			<a href="https://github.com" target="_blank" aria-label="GitHub">
				<img src="/images/github.svg" alt="GitHub">
			</a> <a href="https://twitter.com" target="_blank" aria-label="Twitter">
				<img src="/images/twitter.svg" alt="Twitter">
			</a> <a href="mailto:support@smartdairy.com" aria-label="Email"> <img
				src="/images/email.svg" alt="Email">
			</a>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
